<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marisco Alegre | Tienda PRO 6.2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f6f6f4;--ink:#101114;--muted:#667085;--card:#fff;--line:#e8e8e0;--orange:#ff5a1f;--dark:#101114;--green:#06a35a;--shadow:0 18px 50px rgba(16,17,20,.08)}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
    header{position:sticky;top:0;z-index:5;background:rgba(246,246,244,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}header h1{font-size:24px;font-weight:950}header p{color:var(--muted);font-weight:700;margin-top:4px}header button{border:0;background:var(--dark);color:#fff;border-radius:999px;padding:14px 18px;font-weight:900;cursor:pointer}
    main{padding:24px;max-width:1200px;margin:auto}.hero{background:var(--dark);color:#fff;border-radius:32px;padding:34px;margin-bottom:22px;box-shadow:var(--shadow)}.hero h2{font-size:clamp(34px,6vw,62px);font-weight:950;letter-spacing:-2px}.hero p{color:#d4d4d4;margin-top:8px;font-weight:700}
    .filters{display:flex;gap:10px;overflow-x:auto;padding-bottom:14px;margin-bottom:18px}.filters button{border:1px solid var(--line);background:#fff;padding:12px 16px;border-radius:999px;font-weight:900;cursor:pointer;white-space:nowrap}.filters button.active{background:var(--orange);color:#fff;border-color:var(--orange)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.product{background:#fff;border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:var(--shadow)}.photo{height:130px;border-radius:22px;background:linear-gradient(135deg,#ffe7da,#fff);display:grid;place-items:center;font-size:46px;margin-bottom:14px}.product h3{font-size:17px;font-weight:950;margin-bottom:6px}.product p{color:var(--muted);font-size:13px;font-weight:700}.price{font-size:22px;font-weight:950;margin:14px 0}
    .controls{display:flex;gap:8px;align-items:center}.controls button{border:0;background:var(--dark);color:#fff;width:40px;height:40px;border-radius:14px;font-size:20px;font-weight:950;cursor:pointer}.controls span{flex:1;text-align:center;font-weight:950}.add{margin-top:10px;width:100%;border:0;background:var(--orange);color:#fff;border-radius:16px;padding:13px;font-weight:950;cursor:pointer}
    .drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;justify-content:flex-end;z-index:10}.drawer.open{display:flex}.drawer-card{background:#fff;width:min(430px,100%);height:100%;padding:22px;overflow-y:auto}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.drawer-head h3{font-size:28px;font-weight:950}.drawer-head button{border:0;background:#f1f1eb;border-radius:14px;width:42px;height:42px;font-weight:950;cursor:pointer}
    .cart-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line);align-items:center}.cart-row strong{font-size:14px}.cart-row span{color:var(--muted);font-weight:800}.form{display:grid;gap:8px;margin-top:20px}.form label{font-size:13px;font-weight:900;color:var(--muted)}.form input{border:1px solid var(--line);border-radius:16px;padding:14px;font:inherit;font-weight:700;outline:none}.cart-total{display:flex;justify-content:space-between;margin:20px 0;padding-top:18px;border-top:1px solid var(--line);font-weight:950}.cart-total strong{font-size:26px}.confirm{width:100%;border:0;background:var(--green);color:#fff;border-radius:18px;padding:16px;font-weight:950;cursor:pointer}
    .toast{position:fixed;bottom:20px;left:20px;background:var(--dark);color:#fff;padding:14px 18px;border-radius:16px;font-weight:900;transform:translateY(120px);opacity:0;transition:.25s;z-index:20}.toast.show{transform:translateY(0);opacity:1}.toast.error{background:#991b1b}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}main{padding:16px}.hero{padding:24px}}
  </style>
</head>
<body>
  <header><div><h1>🦐 Marisco Alegre</h1><p>Tienda PRO 6.2</p></div><button onclick="openCart()">🛒 Carrito <span id="cartCount">0</span></button></header>
  <main><section class="hero"><h2>Menú completo</h2><p>Elige cantidades con + y −. Al confirmar, el pedido se enviará al chat de WhatsApp para finalizar datos.</p></section><div class="filters" id="filters"></div><div class="grid" id="products"></div></main>
  <div class="drawer" id="drawer"><div class="drawer-card"><div class="drawer-head"><h3>Tu pedido</h3><button onclick="closeCart()">✕</button></div><div id="cartItems"></div><div class="form"><label>Número de WhatsApp con lada</label><input id="numero" placeholder="Ejemplo: 3312345678 o 5213312345678"><label>Nombre</label><input id="nombre" placeholder="Ejemplo: Diego"></div><div class="cart-total"><span>Total</span><strong id="cartTotal">$0</strong></div><button class="confirm" onclick="sendOrder()">Confirmar y enviar a WhatsApp</button></div></div><div class="toast" id="toast"></div>
  <script>
    let menu=[],categories=[],selectedCategory='Todos',quantities={},cart={};
    const money=v=>`$${Number(v||0).toLocaleString('es-MX')}`;
    function toast(msg,type='ok'){const e=document.getElementById('toast');e.textContent=msg;e.className=`toast show ${type==='error'?'error':''}`;setTimeout(()=>e.classList.remove('show'),3000)}
    async function loadMenu(){const res=await fetch('/api/menu');const data=await res.json();menu=data.products;categories=['Todos',...data.categories];renderFilters();renderProducts();renderCart()}
    function renderFilters(){filters.innerHTML=categories.map(c=>`<button class="${c===selectedCategory?'active':''}" onclick="selectCategory('${c}')">${c}</button>`).join('')}
    function selectCategory(c){selectedCategory=c;renderFilters();renderProducts()}
    function emoji(p){if(p.type==='drink')return'🥤';if(p.category==='Camarones')return'🦐';if(p.category==='Pulpo')return'🐙';if(p.category==='Cortes')return'🥩';if(p.category==='Aguachiles')return'🌶️';return'🍽️'}
    function renderProducts(){const list=selectedCategory==='Todos'?menu:menu.filter(p=>p.category===selectedCategory);products.innerHTML=list.map(p=>{const q=quantities[p.id]||1;return `<article class="product"><div class="photo">${emoji(p)}</div><h3>${p.name}</h3><p>${p.category}</p><div class="price">${money(p.price)}</div><div class="controls"><button onclick="dec('${p.id}')">−</button><span>${q}</span><button onclick="inc('${p.id}')">+</button></div><button class="add" onclick="addToCart('${p.id}')">Agregar</button></article>`}).join('')}
    function inc(id){quantities[id]=(quantities[id]||1)+1;renderProducts()}function dec(id){quantities[id]=Math.max((quantities[id]||1)-1,1);renderProducts()}
    function addToCart(id){const p=menu.find(x=>x.id===id);if(!p)return;const q=quantities[id]||1;if(!cart[id])cart[id]={...p,cantidad:0};cart[id].cantidad+=q;quantities[id]=1;toast('Producto agregado');renderProducts();renderCart()}
    function renderCart(){const items=Object.values(cart);cartCount.textContent=items.reduce((s,i)=>s+i.cantidad,0);if(!items.length){cartItems.innerHTML='<p>Tu carrito está vacío.</p>';cartTotal.textContent='$0';return}cartItems.innerHTML=items.map(i=>`<div class="cart-row"><strong>${i.name}</strong><span>${i.cantidad}x</span><strong>${money(i.price*i.cantidad)}</strong></div>`).join('');cartTotal.textContent=money(items.reduce((s,i)=>s+i.price*i.cantidad,0))}
    function openCart(){drawer.classList.add('open');renderCart()}function closeCart(){drawer.classList.remove('open')}
    async function sendOrder(){const numero=document.getElementById('numero').value.trim().replace(/\D/g,'');const nombre=document.getElementById('nombre').value.trim();const items=Object.values(cart).map(i=>({id:i.id,cantidad:i.cantidad}));if(!items.length)return toast('Agrega productos primero','error');if(!numero)return toast('Escribe tu número de WhatsApp','error');try{const res=await fetch('/api/tienda/pedido',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({numero,nombre,items})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Error al enviar pedido');cart={};renderCart();closeCart();toast('Pedido enviado a WhatsApp');alert(data.mensaje || 'Listo. Revisa WhatsApp para confirmar el pedido. Si no llega, revisa que el número esté correcto con lada.')}catch(e){toast(e.message,'error')}}
    document.addEventListener('DOMContentLoaded',loadMenu);
  </script>
</body>
</html>
